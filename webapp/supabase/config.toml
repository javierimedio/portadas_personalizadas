# Configuración de Supabase CLI para el entorno de DESARROLLO de esta migración.
# NO apunta a ningún proyecto por sí sola — el project_id real se pasa con
# `supabase link --project-ref <ref-del-proyecto-de-desarrollo>` (nunca el de
# producción). Ver docs/06-roadmap.md § "Estrategia de entornos".
project_id = "portadas-personalizadas-dev"

[api]
enabled = true
port = 54321

[db]
port = 54322

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"

[storage]
enabled = true
