name: webapp CI

# Solo afecta al código de la migración (webapp/). No toca ni despliega
# index.html/vercel.json de la raíz — ver docs/06-roadmap.md.
on:
  push:
    paths:
      - "webapp/**"
      - ".github/workflows/webapp-ci.yml"
  pull_request:
    paths:
      - "webapp/**"
      - ".github/workflows/webapp-ci.yml"

defaults:
  run:
    working-directory: webapp

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
